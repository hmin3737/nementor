name: nementor
description: 내멘토 - 수학/전과목 학습 플랫폼
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 상태관리
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 네비게이션
  go_router: ^14.2.7

  # 백엔드
  supabase_flutter: ^2.5.6

  # 소셜 로그인
  sign_in_with_apple: ^6.1.1
  kakao_flutter_sdk_user: ^1.9.1

  # 리치 텍스트 에디터
  flutter_quill: ^11.5.0

  # UI
  flutter_math_fork: ^0.7.2
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  photo_view: ^0.15.0
  flutter_svg: ^2.0.10+1

  # 결제
  in_app_purchase: ^3.2.0

  # 푸시 알림
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.4
  flutter_local_notifications: ^17.2.3

  # 보안 저장소
  flutter_secure_storage: ^9.2.2

  # 애니메이션
  confetti: ^0.7.0
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # 유틸
  intl: ^0.20.0
  uuid: ^4.4.2
  timeago: ^3.7.0
  equatable: ^2.0.5
  collection: ^1.18.0
  url_launcher: ^6.3.0

  # 폰트
  google_fonts: ^6.2.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#8000FF"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#8000FF"
    theme_color: "#8000FF"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  custom_lint: ^0.7.6
  riverpod_lint: ^2.6.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Thin.ttf
          weight: 100
        - asset: assets/fonts/Pretendard-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Pretendard-Light.ttf
          weight: 300
        - asset: assets/fonts/Pretendard-Regular.ttf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.ttf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Pretendard-Black.ttf
          weight: 900
